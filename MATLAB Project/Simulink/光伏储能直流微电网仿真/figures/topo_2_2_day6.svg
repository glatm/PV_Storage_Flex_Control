<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" font-family="Segoe UI, Arial, sans-serif">
  <defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2c3e50"/></marker></defs>
  <rect x="0" y="0" width="680" height="300" fill="#ffffff"/>
  <text x="340" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b2631">22.2 插入半桥双向 Buck-Boost（电池能量可控）</text>

  <line x1="40" y1="160" x2="640" y2="160" stroke="#2c3e50" stroke-width="4"/>
  <text x="340" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50">48V 直流母线</text>

  <!-- PV + Boost -->
  <rect x="40" y="40" width="90" height="38" rx="5" fill="#eafaf1" stroke="#1e8449" stroke-width="2"/>
  <text x="85" y="63" text-anchor="middle" font-size="12" fill="#1e8449">PV</text>
  <line x1="85" y1="78" x2="85" y2="100" stroke="#2c3e50" stroke-width="3"/>
  <rect x="40" y="100" width="90" height="38" rx="5" fill="#eaf2f8" stroke="#2471a3" stroke-width="2"/>
  <text x="85" y="123" text-anchor="middle" font-size="12" fill="#2471a3">Boost</text>
  <line x1="130" y1="119" x2="200" y2="119" stroke="#2c3e50" stroke-width="3"/>
  <line x1="200" y1="119" x2="200" y2="160" stroke="#2c3e50" stroke-width="3" marker-end="url(#arr)"/>

  <!-- 半桥（高亮新增） -->
  <rect x="250" y="95" width="150" height="50" rx="6" fill="#fdebd0" stroke="#ca6f1e" stroke-width="2"/>
  <text x="325" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#ca6f1e">半桥双向</text>
  <text x="325" y="132" text-anchor="middle" font-size="10" fill="#555">S1_top / S2_bot + L</text>
  <line x1="325" y1="95" x2="325" y2="160" stroke="#2c3e50" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="270" y="200" width="110" height="38" rx="5" fill="#eafaf1" stroke="#1e8449" stroke-width="2"/>
  <text x="325" y="223" text-anchor="middle" font-size="11" fill="#1e8449">电池 48V</text>
  <line x1="325" y1="145" x2="325" y2="200" stroke="#2c3e50" stroke-width="3"/>

  <!-- 负载 -->
  <rect x="520" y="100" width="100" height="44" rx="5" fill="#fadbd8" stroke="#922b21" stroke-width="2"/>
  <text x="570" y="123" text-anchor="middle" font-size="12" fill="#922b21">负载</text>
  <line x1="570" y1="100" x2="570" y2="160" stroke="#2c3e50" stroke-width="3" marker-end="url(#arr)"/>

  <text x="40" y="262" font-size="10" fill="#777">变化点：电池从"直挂"改为"经半桥接入"——充/放电方向、功率大小第一次可主动控制（本天仍开环固定占空比）。</text>
  <rect x="40" y="270" width="600" height="24" rx="5" fill="#fef9e7" stroke="#b7950b" stroke-width="1.2"/>
  <text x="50" y="286" font-size="10" fill="#7d6608">本阶段要害：浮地驱动（上管跟源跑）+ 死区防直通。48V 同地用非隔离半桥。</text>
</svg>
