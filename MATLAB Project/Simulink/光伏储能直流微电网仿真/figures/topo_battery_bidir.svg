<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2c3e50"/></marker>
    <marker id="garr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2980b9"/></marker>
  </defs>
  <rect x="0" y="0" width="680" height="380" fill="#ffffff"/>
  <text x="340" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2631">半桥双向 Buck-Boost 变换器拓扑（电池侧）</text>

  <!-- 母线 -->
  <line x1="60" y1="60" x2="420" y2="60" stroke="#2c3e50" stroke-width="4"/>
  <text x="60" y="52" font-size="13" font-weight="bold" fill="#c0392b">母线(+)</text>
  <!-- Cout_Bus -->
  <line x1="95" y1="60" x2="95" y2="92" stroke="#2c3e50" stroke-width="2"/>
  <rect x="85" y="92" width="20" height="8" fill="none" stroke="#2c3e50" stroke-width="2"/>
  <rect x="85" y="104" width="20" height="8" fill="none" stroke="#2c3e50" stroke-width="2"/>
  <line x1="95" y1="112" x2="95" y2="340" stroke="#2c3e50" stroke-width="3"/>
  <text x="120" y="104" font-size="10" fill="#555">Cout_Bus</text>

  <!-- S1_top -->
  <line x1="200" y1="60" x2="200" y2="78" stroke="#2c3e50" stroke-width="3"/>
  <rect x="172" y="78" width="56" height="40" rx="5" fill="#eaf2f8" stroke="#2471a3" stroke-width="2"/>
  <text x="200" y="102" text-anchor="middle" font-size="12" fill="#2471a3">S1_top</text>
  <line x1="200" y1="118" x2="200" y2="132" stroke="#2c3e50" stroke-width="3"/>
  <!-- 中点 -->
  <circle cx="200" cy="132" r="4" fill="#2c3e50"/>
  <text x="150" y="128" font-size="10" fill="#555">中点</text>
  <!-- S2_bot -->
  <line x1="200" y1="132" x2="200" y2="150" stroke="#2c3e50" stroke-width="3"/>
  <rect x="172" y="150" width="56" height="40" rx="5" fill="#eaf2f8" stroke="#2471a3" stroke-width="2"/>
  <text x="200" y="174" text-anchor="middle" font-size="12" fill="#2471a3">S2_bot</text>
  <line x1="200" y1="190" x2="200" y2="340" stroke="#2c3e50" stroke-width="3"/>

  <!-- L_bidir 支路 -->
  <line x1="200" y1="132" x2="340" y2="132" stroke="#2c3e50" stroke-width="3"/>
  <text x="270" y="124" font-size="10" fill="#555">中点</text>
  <path d="M340,132 q12,12 0,24 q-12,12 0,24 q12,12 0,24 q-12,12 0,24" fill="none" stroke="#2c3e50" stroke-width="3"/>
  <text x="356" y="150" font-size="12" font-weight="bold" fill="#2471a3">L_bidir</text>
  <line x1="340" y1="216" x2="340" y2="232" stroke="#2c3e50" stroke-width="3"/>

  <!-- Cin_Bat + 电池 -->
  <rect x="300" y="218" width="20" height="8" fill="none" stroke="#2c3e50" stroke-width="2"/>
  <rect x="300" y="230" width="20" height="8" fill="none" stroke="#2c3e50" stroke-width="2"/>
  <line x1="310" y1="238" x2="310" y2="340" stroke="#2c3e50" stroke-width="3"/>
  <text x="336" y="232" font-size="10" fill="#555">Cin_Bat</text>
  <rect x="330" y="232" width="120" height="48" rx="6" fill="#eafaf1" stroke="#1e8449" stroke-width="2"/>
  <text x="390" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e8449">电池 48V</text>
  <text x="390" y="270" text-anchor="middle" font-size="10" fill="#555">(+)/(−) 与母线共地</text>
  <line x1="390" y1="280" x2="390" y2="340" stroke="#2c3e50" stroke-width="3"/>

  <!-- 地 -->
  <line x1="60" y1="340" x2="600" y2="340" stroke="#2c3e50" stroke-width="3"/>
  <path d="M330,340 l-12,0 m12,-6 l-9,6 m9,-12 l-6,12" stroke="#2c3e50" stroke-width="2" fill="none"/>
  <text x="60" y="358" font-size="12" font-weight="bold" fill="#2c3e50">GND</text>

  <!-- 栅极驱动 -->
  <rect x="440" y="78" width="120" height="40" rx="6" fill="#fef9e7" stroke="#b7950b" stroke-width="2"/>
  <text x="500" y="98" text-anchor="middle" font-size="11" fill="#b7950b">栅驱（浮地）</text>
  <text x="500" y="112" text-anchor="middle" font-size="9" fill="#555">上管跟源跑</text>
  <line x1="228" y1="98" x2="440" y2="98" stroke="#2980b9" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#garr)"/>
  <text x="235" y="92" font-size="9" fill="#2980b9">G</text>

  <rect x="440" y="150" width="120" height="40" rx="6" fill="#fef9e7" stroke="#b7950b" stroke-width="2"/>
  <text x="500" y="170" text-anchor="middle" font-size="11" fill="#b7950b">栅驱（共地）</text>
  <text x="500" y="184" text-anchor="middle" font-size="9" fill="#555">下管踩实地</text>
  <line x1="228" y1="170" x2="440" y2="170" stroke="#2980b9" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#garr)"/>

  <rect x="440" y="250" width="120" height="44" rx="6" fill="#fdebd0" stroke="#ca6f1e" stroke-width="2"/>
  <text x="500" y="270" text-anchor="middle" font-size="11" fill="#ca6f1e">互补 PWM</text>
  <text x="500" y="284" text-anchor="middle" font-size="10" fill="#922b21">+ 死区(防直通)</text>
  <line x1="500" y1="250" x2="500" y2="190" stroke="#2980b9" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#garr)"/>
  <line x1="500" y1="250" x2="500" y2="190" stroke="#2980b9" stroke-width="0"/>
  <line x1="500" y1="190" x2="500" y2="118" stroke="#2980b9" stroke-width="1.5" stroke-dasharray="4 3"/>

  <text x="40" y="372" font-size="10" fill="#777">两管互补导通 + 死区；D_top+D_bot=1。上管斩波→Buck充电，下管斩波→Boost放电。</text>
</svg>
