<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" font-family="Segoe UI, Arial, sans-serif">
  <defs><marker id="arr2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2c3e50"/></marker></defs>
  <rect x="0" y="0" width="680" height="360" fill="#ffffff"/>
  <text x="340" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b2631">21.11 平均模型（Day 16：信号流功率平衡，无功率拓扑）</text>
  <text x="340" y="42" text-anchor="middle" font-size="11" fill="#777">纯代数运算 + 一个 SOC 积分器；不含开关/电感/变压器/保护（状态空间平均的落地）</text>

  <!-- 输入 -->
  <rect x="30" y="80" width="120" height="120" rx="6" fill="#eaf2f8" stroke="#2471a3" stroke-width="2"/>
  <text x="90" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#2471a3">输入常量</text>
  <text x="90" y="122" text-anchor="middle" font-size="10" fill="#555">Ir（辐照）</text>
  <text x="90" y="142" text-anchor="middle" font-size="10" fill="#555">T（温度）</text>
  <text x="90" y="162" text-anchor="middle" font-size="10" fill="#555">P_load_set</text>
  <text x="90" y="186" text-anchor="middle" font-size="9" fill="#888">（叠日变化造典型日）</text>

  <!-- PV_P -->
  <rect x="200" y="70" width="130" height="44" rx="6" fill="#eafaf1" stroke="#1e8449" stroke-width="2"/>
  <text x="265" y="89" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e8449">PV_P</text>
  <text x="265" y="104" text-anchor="middle" font-size="9" fill="#555">Fcn 单二极管近似 → P_pv</text>

  <!-- Sum -->
  <rect x="200" y="150" width="130" height="46" rx="6" fill="#fef9e7" stroke="#b7950b" stroke-width="2"/>
  <text x="265" y="170" text-anchor="middle" font-size="11" font-weight="bold" fill="#b7950b">Sum</text>
  <text x="265" y="185" text-anchor="middle" font-size="9" fill="#555">P_bat = P_load − P_pv</text>

  <!-- Integrator -->
  <rect x="200" y="230" width="130" height="56" rx="6" fill="#fdebd0" stroke="#ca6f1e" stroke-width="2"/>
  <text x="265" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="#ca6f1e">∫ SOC</text>
  <text x="265" y="265" text-anchor="middle" font-size="9" fill="#555">IC=0.5, Gain −1/(Cap·3600)</text>
  <text x="265" y="279" text-anchor="middle" font-size="9" fill="#555">Sat 0.1~0.9</text>

  <!-- V_bat -->
  <rect x="390" y="230" width="130" height="56" rx="6" fill="#eafaf1" stroke="#1e8449" stroke-width="2"/>
  <text x="455" y="252" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e8449">V_bat</text>
  <text x="455" y="267" text-anchor="middle" font-size="9" fill="#555">Fcn 200+80·SOC</text>
  <text x="455" y="281" text-anchor="middle" font-size="9" fill="#555">→ I_bat = P_bat/V_bat</text>

  <!-- 常量 母线/输出 -->
  <rect x="390" y="70" width="150" height="44" rx="6" fill="#eaf2f8" stroke="#2471a3" stroke-width="2"/>
  <text x="465" y="89" text-anchor="middle" font-size="11" font-weight="bold" fill="#2471a3">电压常量</text>
  <text x="465" y="104" text-anchor="middle" font-size="9" fill="#555">V_pv / V_bus=700 / V_out=400</text>

  <!-- Mux -->
  <rect x="520" y="120" width="100" height="50" rx="6" fill="#fadbd8" stroke="#922b21" stroke-width="2"/>
  <text x="570" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#922b21">8 路 Mux</text>
  <text x="570" y="155" text-anchor="middle" font-size="9" fill="#555">time,Vpv,Vbus,…</text>

  <!-- To File -->
  <rect x="520" y="200" width="100" height="44" rx="6" fill="#fadbd8" stroke="#922b21" stroke-width="2"/>
  <text x="570" y="219" text-anchor="middle" font-size="11" font-weight="bold" fill="#922b21">To File</text>
  <text x="570" y="234" text-anchor="middle" font-size="9" fill="#555">导出 24h 数据</text>

  <!-- 连线 -->
  <line x1="150" y1="120" x2="200" y2="120" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr2)"/>
  <line x1="150" y1="172" x2="200" y2="172" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr2)"/>
  <line x1="265" y1="114" x2="265" y2="150" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr2)"/>
  <line x1="265" y1="196" x2="265" y2="230" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr2)"/>
  <line x1="330" y1="258" x2="390" y2="258" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr2)"/>
  <line x1="330" y1="172" x2="330" y2="258" stroke="#2c3e50" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="330" y1="258" x2="390" y2="258" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr2)"/>
  <line x1="455" y1="230" x2="455" y2="200" stroke="#2c3e50" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr2)"/>
  <line x1="465" y1="114" x2="465" y2="120" stroke="#2c3e50" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="540" y1="170" x2="520" y2="170" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr2)"/>
  <line x1="520" y1="170" x2="520" y2="200" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr2)"/>

  <text x="30" y="340" font-size="10" fill="#777">变化点（范式级）：从详细物理 Simscape 模型（开关/电感/电容/变压器/保护全有）彻底转向纯信号流——只有"功率守恒 + 能量积分"。服务 24h 能量平衡/SOC 轨迹，不做微秒开关暂态。</text>
</svg>
