<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2c3e50"/></marker>
    <marker id="carr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2980b9"/></marker>
  </defs>
  <rect x="0" y="0" width="680" height="330" fill="#ffffff"/>
  <text x="340" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b2631">22.5 双源并联下垂（多源无通信均流）</text>

  <line x1="40" y1="190" x2="640" y2="190" stroke="#2c3e50" stroke-width="4"/>
  <text x="340" y="182" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50">48V 直流母线</text>

  <!-- 源1 -->
  <rect x="40" y="70" width="120" height="40" rx="5" fill="#eaf2f8" stroke="#2471a3" stroke-width="2"/>
  <text x="100" y="94" text-anchor="middle" font-size="11" fill="#2471a3">源1 PI闭环</text>
  <rect x="40" y="120" width="120" height="40" rx="5" fill="#eaf2f8" stroke="#2471a3" stroke-width="2"/>
  <text x="100" y="138" text-anchor="middle" font-size="11" fill="#2471a3">半桥 + 电池</text>
  <text x="100" y="153" text-anchor="middle" font-size="9" fill="#555">Vref=V0+k·Ibat</text>
  <line x1="160" y1="140" x2="240" y2="140" stroke="#2c3e50" stroke-width="3"/>
  <line x1="240" y1="140" x2="240" y2="190" stroke="#2c3e50" stroke-width="3" marker-end="url(#arr)"/>

  <!-- 源2（高亮新增） -->
  <rect x="290" y="70" width="150" height="50" rx="6" fill="#fdebd0" stroke="#ca6f1e" stroke-width="2"/>
  <text x="365" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#ca6f1e">源2 受控电流源</text>
  <text x="365" y="106" text-anchor="middle" font-size="10" fill="#555">下垂律 + Sat3(±10A)</text>
  <line x1="365" y1="120" x2="365" y2="190" stroke="#2c3e50" stroke-width="3" marker-end="url(#arr)"/>
  <text x="365" y="142" text-anchor="middle" font-size="9" fill="#ca6f1e">I2=(V02−Vbus)/0.2</text>

  <!-- 负载 -->
  <rect x="520" y="120" width="100" height="44" rx="5" fill="#fadbd8" stroke="#922b21" stroke-width="2"/>
  <text x="570" y="143" text-anchor="middle" font-size="12" fill="#922b21">负载</text>
  <line x1="570" y1="120" x2="570" y2="190" stroke="#2c3e50" stroke-width="3" marker-end="url(#arr)"/>

  <!-- 反馈 -->
  <line x1="240" y1="190" x2="100" y2="190" stroke="#2980b9" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#carr)"/>
  <line x1="100" y1="190" x2="100" y2="160" stroke="#2980b9" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="365" y1="190" x2="365" y2="160" stroke="#2980b9" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#carr)"/>

  <text x="40" y="250" font-size="10" fill="#777">变化点：+第二路电源（受控电流源）；PI 的 Vref 上叠加 k·Ibat 变成下垂。符号陷阱：教材 V0−k·Iout，本项目须用 V0+k·Ibat。</text>
  <rect x="40" y="262" width="600" height="26" rx="5" fill="#fef9e7" stroke="#b7950b" stroke-width="1.2"/>
  <text x="50" y="279" font-size="10" fill="#7d6608">均流比 I1:I2 = Rv2:Rv1 = 0.2:0.1 = 2:1。限幅只限源2指令，短路电流绕过 → 限幅≠保护。</text>
</svg>
