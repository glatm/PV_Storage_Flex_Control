<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" font-family="Segoe UI, Arial, sans-serif">
  <defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2c3e50"/></marker></defs>
  <rect x="0" y="0" width="680" height="330" fill="#ffffff"/>
  <text x="340" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b2631">22.7 极间短路故障注入（在 2.5 之上加故障支路）</text>

  <line x1="40" y1="170" x2="640" y2="170" stroke="#2c3e50" stroke-width="4"/>
  <text x="340" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50">48V 直流母线</text>

  <!-- 源1 -->
  <rect x="40" y="70" width="120" height="40" rx="5" fill="#eaf2f8" stroke="#2471a3" stroke-width="2"/>
  <text x="100" y="94" text-anchor="middle" font-size="11" fill="#2471a3">源1 PI闭环</text>
  <rect x="40" y="120" width="120" height="36" rx="5" fill="#eaf2f8" stroke="#2471a3" stroke-width="2"/>
  <text x="100" y="142" text-anchor="middle" font-size="11" fill="#2471a3">半桥 + 电池</text>
  <line x1="160" y1="138" x2="240" y2="138" stroke="#2c3e50" stroke-width="3"/>
  <line x1="240" y1="138" x2="240" y2="170" stroke="#2c3e50" stroke-width="3" marker-end="url(#arr)"/>

  <!-- 源2 -->
  <rect x="290" y="78" width="150" height="46" rx="6" fill="#eaf2f8" stroke="#2471a3" stroke-width="2"/>
  <text x="365" y="98" text-anchor="middle" font-size="11" fill="#2471a3">源2 受控电流源</text>
  <text x="365" y="114" text-anchor="middle" font-size="9" fill="#555">下垂律 + Sat3</text>
  <line x1="365" y1="124" x2="365" y2="170" stroke="#2c3e50" stroke-width="3" marker-end="url(#arr)"/>

  <!-- 负载 -->
  <rect x="520" y="110" width="100" height="44" rx="5" fill="#fadbd8" stroke="#922b21" stroke-width="2"/>
  <text x="570" y="133" text-anchor="middle" font-size="12" fill="#922b21">负载</text>
  <line x1="570" y1="110" x2="570" y2="170" stroke="#2c3e50" stroke-width="3" marker-end="url(#arr)"/>

  <!-- 故障支路（高亮） -->
  <text x="430" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#922b21">故障支路（极间短路注入）</text>
  <line x1="430" y1="210" x2="430" y2="235" stroke="#2c3e50" stroke-width="3"/>
  <rect x="408" y="235" width="44" height="22" rx="3" fill="#fdebd0" stroke="#ca6f1e" stroke-width="2"/>
  <text x="430" y="250" text-anchor="middle" font-size="10" fill="#ca6f1e">SW</text>
  <line x1="452" y1="246" x2="500" y2="246" stroke="#2c3e50" stroke-width="3"/>
  <rect x="500" y="234" width="44" height="24" rx="3" fill="#fdebd0" stroke="#ca6f1e" stroke-width="2"/>
  <text x="522" y="250" text-anchor="middle" font-size="10" fill="#ca6f1e">Rf=0.1Ω</text>
  <line x1="544" y1="246" x2="544" y2="300" stroke="#2c3e50" stroke-width="3"/>
  <line x1="40" y1="300" x2="640" y2="300" stroke="#2c3e50" stroke-width="3"/>
  <path d="M400,235 l0,-8 m0,4 l-6,-6 m12,0 l-6,6" stroke="#922b21" stroke-width="2" fill="none"/>
  <text x="430" y="290" font-size="10" fill="#922b21">“火线碰零线” · 直流无过零点、di/dt 极高</text>

  <text x="40" y="322" font-size="10" fill="#777">变化点：+1 开关 +1 电阻，制造极间短路。控制器限幅救不了短路，必须靠开断（引出 22.8）。</text>
</svg>
